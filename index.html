<!doctype html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

  <!-- サイトタイトル -->
  <title>Chronometer | 流れる時間</title>

  <!-- ✅ アイコン・PWA設定 (ここを完全に差し替え) ✅ -->

  <!-- 1. Apple / iOS (ホーム画面追加・Safari) 用 (最も重要) -->
  <!-- 端末ごとの強制リサイズとアスペクト比歪みを防ぐ -->
  <link rel="apple-touch-icon" href="/favicon.png" />

  <!-- 2. 標準の Favicon (PCのタブ・ブックマーク用) -->
  <!-- Appleが嫌うサイズ設定を避け、標準的なPNGとして指定 -->
  <link rel="icon" type="image/png" href="/favicon.png" sizes="192x192" />

  <!-- 3. Web App Manifest (Android / PWAの起動設定用) -->
  <!-- ホーム画面追加時の動作、テーマカラー、アイコンを詳細定義 -->
  <link rel="manifest" href="/manifest.json" />

  <!-- 4. iOSのスタンドアローンモード設定 -->
  <!-- ホーム画面から起動した際、Safariのツールバーを消す -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Chronometer" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <!-- 5. テーマカラー (アドレスバーやステータスバーの色) -->
  <meta name="theme-color" content="#0b0b12" />

  <!-- ✅ フォント読み込み (変更なし) ✅ -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap"
    rel="stylesheet" />
</head>

<body>
  <div id="root"></div>

  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
